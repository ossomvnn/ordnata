<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bewohner</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #eef2f6;
    margin: 0;
    padding: 30px;
}

/* Back button always visible */
#backBtn {
    background: #6c7a89;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    position: fixed;
    top: 20px;
    left: 20px;
    font-weight: bold;
}
#backBtn:hover { background: #5a6772; }

/* Main card */
.card {
    background: #ffffff;
    padding: 30px;
    border-radius: 18px;
    width: 950px;
    max-width: 95%;
    margin: 70px auto 0 auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.10);
}

/* Title */
h2 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 25px;
    color: #2d3436;
}

/* Filter section */
.filter-group {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.filter-group select {
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #d1d9e6;
    font-size: 15px;
    background: white;
    width: 180px;
    transition: 0.2s;
}

.filter-group select:hover {
    border-color: #4a90e2;
}

#countText {
    font-weight: bold;
    color: #333;
}

/* Input form */
.form-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
    justify-content: center;
}

.form-group input,
.form-group select {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ccd4dd;
    font-size: 15px;
    flex: 1 1 200px;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #4a90e2;
}


/* Add button */
.add {
    background: #008080;
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    flex: 1 1 200px;
    transition: 0.2s;
    justify-content: center;
}
.add:hover {
    background: #357ABD;
}

/* Table styling */
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    table-layout: fixed; /* <- FIXED COLUMNS */
}

th, td {
    padding: 12px;
    text-align: left;
    overflow-wrap: break-word; /* <- Wrap long text */
}

th {
    background: #4a90e2;
    color: white;
    font-size: 15px;
}

tr:nth-child(even) { background: #f7f9fc; }
tr:hover { background: #e8f1ff; }

/* Remove button */
.removeBtn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
}
.removeBtn:hover { background: #c0392b; }

footer {
    text-align: center;
    margin-top: 20px;
    color: #888;
    font-size: 12.5px;
}
.countBox {
    background: #4a90e2;
    color: white;
    padding: 8px 14px;
    border-radius: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<button id="backBtn" onclick="location.href='index.html'">← Zurück</button>
<br>
<br>
    <div class="form-group">
        <select id="partFilter" onchange="renderResidents()">
            <option value="Alle">Alle Gebäudeteile</option>
            <option value="A">Gebäudeteil A</option>
            <option value="B">Gebäudeteil B</option>
            <option value="C">Gebäudeteil C</option>
            <option value="D">Gebäudeteil D</option>
        </select>
        <div id="countBox" class="countBox">Count: 0</div>
    </div>
<div class="card">
    <h2>Bewohner</h2>
    <div class="form-group">
        <input id="name" placeholder="Name">
        <select id="part">
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
        </select>
        <input id="room" placeholder="Zimmer nummer">
        <button class="add" onclick="addResident()">Neuen Bewohner hinzufügen</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Gebäudeteil</th>
                <th>Zimmer</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="residentsTableBody"></tbody>
    </table>
</div>

<footer>Entwickelt von Osman</footer>

<script>
function loadResidents(){return JSON.parse(localStorage.getItem('residents')||'[]');}
function saveResidents(r){localStorage.setItem('residents',JSON.stringify(r));}

function renderResidents(){
    const table=document.getElementById('residentsTableBody');
    const all=loadResidents();
    const filter=document.getElementById('partFilter').value;
    const filtered = filter==='Alle' ? all : all.filter(r=>r.part===filter);

    table.innerHTML='';
    filtered.forEach(r=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${r.name}</td>
                      <td>${r.part}</td>
                      <td>${r.room}</td>
                      <td><button class="removeBtn" onclick="removeResident('${r.name}','${r.part}')">entfern</button></td>`;
        table.appendChild(tr);
    });

    document.getElementById('countBox').textContent = 
        `${filtered.length} Bewohner in ${filter}`;
}

function showMessage(msg) {
    const box = document.createElement("div");
    box.innerText = msg;
    box.style.position = "fixed";
    box.style.top = "20px";
    box.style.left = "50%";
    box.style.transform = "translateX(-50%)";
    box.style.background = "#ff4444";
    box.style.color = "#fff";
    box.style.padding = "12px 18px";
    box.style.borderRadius = "8px";
    box.style.zIndex = "99999";
    box.style.fontFamily = "Segoe UI";
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2000);
}

function showMeni(msg) {
    const box = document.createElement("div");
    box.innerText = msg;
    box.style.position = "fixed";
    box.style.top = "20px";
    box.style.left = "50%";
    box.style.transform = "translateX(-50%)";
    box.style.background = "#33c341";
    box.style.color = "#fff";
    box.style.padding = "12px 18px";
    box.style.borderRadius = "8px";
    box.style.zIndex = "99999";
    box.style.fontFamily = "Segoe UI";
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2000);
}

/* ✅ NEW: Prevent adding same resident twice */
function addResident() {
    const name = document.getElementById('name').value.trim();
    const part = document.getElementById('part').value;
    const room = document.getElementById('room').value.trim();

    if (!name || !part || !room) {
        showMessage('Bitte füllen Sie alle Felder aus');
        return;
    }

    const residents = loadResidents();

    // ❗ CHECK FOR DUPLICATE NAME + PART
    const exists = residents.some(r =>
        r.name.toLowerCase() === name.toLowerCase() &&
        r.part === part
    );

    if (exists) {
        showMessage(`Dieser Bewohner existiert bereits in Gebäudeteil ${part}!`);
        return;
    }

    residents.push({ name, part, room });
    saveResidents(residents);

    // Clear input fields
    document.getElementById('name').value = '';
    document.getElementById('room').value = '';

    renderResidents();
    showMeni(`Bewohner "${name}" wurde hinzugefügt!`);
}

function removeResident(name, part) {
    let r = loadResidents();
    r = r.filter(x => !(x.name === name && x.part === part));
    saveResidents(r);
    renderResidents();

    showMessage(`Bewohner "${name}" wurde entfernt!`);
}

window.onload = renderResidents;
</script>
