<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sperrliste</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    /* Synchronized background color */
    background: #f0f2f5; 
    margin: 0;
    padding: 30px;
}

/* Always visible back button */
#backBtn {
    background: #6c7a89;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    position: fixed;
    top: 20px;
    left: 20px;
    font-weight: bold;
}
#backBtn:hover {
    background: #5a6772;
}

/* Main card */
.card {
    background: #ffffff;
    padding: 30px;
    border-radius: 18px;
    width: 950px;
    max-width: 95%;
    margin: 70px auto 0 auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.10);
}

/* Title */
h2 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 25px;
    color: #2d3436;
}

/* Form group (Block Form) */
.form-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
    justify-content: center; /* Center the form elements */
}

.form-group input,
.form-group select {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #ccd4dd;
    font-size: 15px;
    flex: 1 1 200px;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    /* Synchronized focus border color */
    border-color: #357ABD;
}

.form-group button {
    /* Kept red for blocking action */
    background: #e74c3c; 
    color: white;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    flex: 1 1 200px;
    transition: 0.2s;
}

.form-group button:hover {
    background: #c0392b; /* Darker red */
}

/* Table styling */
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    table-layout: fixed;
}

th, td {
    padding: 12px;
    text-align: left;
}

th {
    /* Synchronized table header color */
    background: #357ABD; 
    color: white;
}

td {
    border-bottom: 1px solid #eef0f3;
    overflow-wrap: break-word;
}

tr:nth-child(even) { background: #f7f9fc; }
/* Synchronized table hover color */
tr:hover { background: #e8f1ff; }

/* Remove button */
.removeBtn {
    background: #2ecc71; /* Green for removal/unblocking */
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
}

.removeBtn:hover { background: #27ae60; }

footer {
    text-align: center;
    margin-top: 20px;
    color: #888;
    font-size: 12.5px;
}
</style>
</head>

<body>

<button id="backBtn" onclick="location.href='index.html'">← Zurück</button>

<div class="card">
    <h2>Gesperrte Personen</h2>

    <div class="form-group">
        <select id="blockPart">
            <option value="">Gebäudeteil wählen</option>
            <option value="A">Gebäudeteil A</option>
            <option value="B">Gebäudeteil B</option>
            <option value="C">Gebäudeteil C</option>
            <option value="D">Gebäudeteil D</option>
        </select>

        <select id="blockName">
            <option value="">Namen auswählen</option>
        </select>

        <input type="text" id="blockReason" placeholder="Grund für Sperrung">
        <input type="number" id="blockDays" placeholder="Tage gesperrt">

        <button id="blockBtn">Sperren</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Gebäudeteil</th>
                <th>Grund</th>
                <th>Gesperrt bis</th>
                <th>Aktion</th>
            </tr>
        </thead>
        <tbody id="blockedTableBody"></tbody>
    </table>
</div>

<footer>Entwickelt von Osman</footer>

<script src="js/blocked.js"></script>

</body>
</html>
